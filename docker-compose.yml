# Every service logs to stdout and stderr, and nothing writes log files of its own.
x-logging: &default-logging
    driver: json-file
    options:
        max-size: '10m'
        max-file: '5'

services:
    shiveron_bot:
        build:
            context: .
            dockerfile: ./docker/Dockerfile
        container_name: shiveron-bot
        restart: unless-stopped
        depends_on:
            shiveron_db:
                condition: service_healthy
            shiveron_libretranslate:
                condition: service_healthy
        environment:
            # Discord
            DISCORD_TOKEN_FILE: /run/secrets/discord_token
            DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID}
            DISCORD_GUILD_ID: ${DISCORD_GUILD_ID}

            # Database
            DB_HOST: shiveron_db
            DB_PORT: 5432
            DB_NAME: ${DB_NAME}
            DB_USER: ${DB_USER}
            DB_PASS_FILE: /run/secrets/db_pass

            # LibreTranslate
            LIBRETRANSLATE_URL: ${LIBRETRANSLATE_URL}

            # Node
            NODE_ENV: ${NODE_ENV}
        secrets:
            - discord_token
            - db_pass
        logging: *default-logging
        networks:
            - shiveron-net

    shiveron_libretranslate:
        image: libretranslate/libretranslate
        container_name: shiveron-libretranslate
        restart: unless-stopped
        environment:
            LT_API_KEYS: 'false'
            PYTHONUNBUFFERED: '1'
            # The bot is the only client, so the web UI is dead weight.
            LT_DISABLE_WEB_UI: 'true'
            # Model updates on every boot delay startup for no benefit; update deliberately instead.
            LT_UPDATE_MODELS: 'false'
            # Translation is CPU-bound. Left unset, CTranslate2 oversubscribes the host and every request gets slower under concurrency. Size this to the cores the host can spare.
            LT_THREADS: ${LT_THREADS:-4}
            # Restricts which language models are loaded, cutting memory use and startup time. Empty means every language, which is the safe default. Set it to a comma-separated list (e.g. "en,fr,de") only if the guilds served never need the others.
            LT_LOAD_ONLY: ${LT_LOAD_ONLY:-}
        volumes:
            - libretranslate_models:/home/libretranslate/.local
        healthcheck:
            test:
                [
                    'CMD',
                    'python',
                    '-c',
                    'import urllib.request; urllib.request.urlopen("http://localhost:5000/languages")',
                ]
            interval: 10s
            timeout: 10s
            retries: 30
            # The first boot downloads the language models, which takes several minutes.
            start_period: 300s
        logging: *default-logging
        networks:
            - shiveron-net

    shiveron_db:
        image: postgres:16-alpine
        container_name: shiveron-db
        restart: unless-stopped
        environment:
            POSTGRES_DB: ${DB_NAME}
            POSTGRES_USER: ${DB_USER}
            POSTGRES_PASSWORD_FILE: /run/secrets/db_pass
        secrets:
            - db_pass
        volumes:
            - shiveron_db_data:/var/lib/postgresql/data
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U ${DB_USER} -d ${DB_NAME}']
            interval: 5s
            timeout: 5s
            retries: 5
        logging: *default-logging
        networks:
            - shiveron-net

secrets:
    discord_token:
        file: ./secrets/discord_token.txt
    db_pass:
        file: ./secrets/db_pass.txt

networks:
    shiveron-net:
        driver: bridge

volumes:
    shiveron_db_data:
    libretranslate_models:
