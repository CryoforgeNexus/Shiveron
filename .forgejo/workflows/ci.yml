name: CI

on:
    push:
        branches: ['dev']
    pull_request:
        branches: ['dev', 'main']

# Every job here only reads the checked-out tree. Declaring the token scope explicitly keeps a compromised action or dependency from writing to the repository, and stops the default token from widening as new jobs are added.
permissions:
    contents: read

jobs:
    lint:
        name: Lint & Format
        runs-on: ubuntu-latest
        steps:
            - name: Install git-lfs
              run: apt-get update && apt-get install -y git-lfs
            - uses: https://github.com/actions/checkout@v4
              with:
                  lfs: true

            - uses: https://github.com/actions/setup-node@v4
              with:
                  node-version: '22'
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            - name: Check formatting
              run: npm run format:check

            - name: Run ESLint
              run: npm run lint

    audit:
        name: Dependency Audit
        runs-on: ubuntu-latest
        steps:
            - name: Install git-lfs
              run: apt-get update && apt-get install -y git-lfs
            - uses: https://github.com/actions/checkout@v4
              with:
                  lfs: true

            - uses: https://github.com/actions/setup-node@v4
              with:
                  node-version: '22'
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            # Verifies every installed tarball against its registry signature, which detects a package republished or tampered with after the lockfile was written.
            - name: Verify registry signatures
              run: npm audit signatures

            # Gated at high so an unreachable moderate advisory in a transitive pin cannot block a release. Moderate findings are reviewed manually rather than enforced here.
            - name: Audit dependencies
              run: npm audit --audit-level=high

    build:
        name: TypeScript Build
        runs-on: ubuntu-latest
        steps:
            - name: Install git-lfs
              run: apt-get update && apt-get install -y git-lfs
            - uses: https://github.com/actions/checkout@v4
              with:
                  lfs: true

            - uses: https://github.com/actions/setup-node@v4
              with:
                  node-version: '22'
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            # Type errors are build failures: tsconfig runs in strict mode and the emitted dist/ is what actually ships.
            - name: Build
              run: npm run build

    docker:
        name: Docker Image Build
        runs-on: ubuntu-latest
        steps:
            # The runner image ships git-lfs and the docker client in the same step because both are missing from it. Without the client the job aborts with "docker: command not found" before reaching the build.
            - name: Install git-lfs and the Docker client
              run: apt-get update && apt-get install -y git-lfs docker.io
            - uses: https://github.com/actions/checkout@v4
              with:
                  lfs: true

            # Fails early with a readable message when the runner has not exposed a daemon socket to the job, which is otherwise reported as an opaque build error.
            - name: Verify the Docker daemon is reachable
              run: docker info

            # Builds the image only; the published image is produced by the release workflow, not here.
            - name: Build image
              run: docker build -f ./docker/Dockerfile -t shiveron:ci .

    lfs-guard:
        name: LFS Pointer Guard
        runs-on: ubuntu-latest
        steps:
            # Checkout without smudging LFS content so the committed git objects can be inspected directly; a raw-committed binary is only distinguishable from a proper pointer at the object level, not in a smudged working tree.
            - name: Install git-lfs
              run: apt-get update && apt-get install -y git-lfs
            - uses: https://github.com/actions/checkout@v4
              with:
                  lfs: false

            - name: Verify LFS-tracked files are stored as pointers
              run: ./.forgejo/scripts/check-lfs-pointers.sh
